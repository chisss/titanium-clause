server:
  port: 8083
  servlet:
    context-path: /titanium-clause

spring:
  application:
    name: titanium-clause-service
  datasource:
    url: jdbc:mysql://localhost:3306/titanium_clause?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      # Axon 系统表加 axon_ 前缀，业务表不受影响
      naming:
        physical-strategy: com.titanium.common.jpa.AxonTablePrefixPhysicalNamingStrategy
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:liquibase/changelog-master.xml
  kafka:
    bootstrap-servers: localhost:9092
    # ⚠️ 本段不被 Spring 消费：本仓未引入 spring-boot-kafka（KafkaProperties 所在模块），
    #    故这里的 key/value-serializer、acks、retries 一律不生效。生产者参数的唯一事实来源是
    #    KafkaConfig#producerFactory（已显式置 acks=all / enable.idempotence / retries）。
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
    consumer:
      group-id: titanium-clause-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.titanium.clause.*
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: BASIC

axon:
  serializer:
    general: jackson
    events: jackson
    messages: jackson
  eventhandling:
    processors:
      clause-query-group:
        dlq:
          enabled: true
          cache:
            enabled: true
            size: 2048
        batchSize: 1
      # 跨域出站组：tracking + DLQ，发布失败的事件由 DeadLetterQueueService 定时重投
      clause-kafka-group:
        mode: tracking
        dlq:
          enabled: true
          max-size: 1000
          cache:
            enabled: true
            size: 2048
        batchSize: 1
  kafka:
    default-topic: clause-events
    consumer:
      group-id: axon-clause-group
    producer:
      retries: 3

logging:
  level:
    root: info
    com.titanium.clause: debug
    org.springframework.kafka: info
    org.axonframework: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/titanium-clause.log
    max-size: 10MB
    max-history: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# 跨域出站中继：声明哪些处理组按「事件存储即 Outbox」形态装配为 tracking + DLQ，
# 并令其首启位点取事件流末端（避免首次部署重放全量历史事件）。
titanium:
  axon:
    outbound-relay:
      groups:
        - clause-kafka-group
